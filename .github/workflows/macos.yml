# Verifica su macOS, in ordine logico: ogni passo parte solo se il precedente è riuscito.
name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

# Una nuova modifica annulla la verifica precedente ancora in corso o in coda.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

# Necessario per pubblicare le release.
permissions:
  contents: write

jobs:
  verifica:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti
        run: |
          sw_vers
          swift --version

      - name: 1. Nucleo (GrooveCore)
        run: swift build --target GrooveCore

      - name: 2. Livello MIDI di macOS (CoreMIDI)
        run: swift build --target MIDIHost

      - name: 3. Riga di comando
        run: swift build --product disableton

      - name: 4. App (SwiftUI)
        run: swift build --product DisabletonApp

      - name: 5. Test
        run: swift test

      - name: 6. App universale Intel + Apple Silicon per macOS 12+
        env:
          VERSION: 0.1.${{ github.run_number }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ github.sha }}
        run: scripts/build-app.sh

      - name: 7. Controllo compatibilità con macOS 12
        run: |
          otool -l dist/Disableton.app/Contents/MacOS/Disableton | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX" | grep -E "minos|version" | head -4

      - name: 8. Avvio di prova della riga di comando
        run: |
          dist/disableton help | head -3
          dist/disableton ports

      - name: 9. Priorità tempo reale e puntualità del ciclo
        run: dist/disableton selftest --seconds 5

      - name: 10. Catena MIDI completa (Krome simulato → Disableton → EZdrummer simulato)
        run: |
          dist/disableton e2e --bpm 120
          dist/disableton e2e --bpm 87

      - name: 11. Brani dimostrativi e libreria
        run: |
          dist/disableton demo --dir "$RUNNER_TEMP/libreria"
          dist/disableton library show --dir "$RUNNER_TEMP/libreria"

      - name: 12. Avvio dell'app e schermate di ogni vista
        run: |
          dist/disableton demo > /dev/null
          export DISABLETON_AUTOMATION=1
          mkdir -p "$RUNNER_TEMP/schermate"
          for MODE in prep commands stage settings; do
            if [ "$MODE" = settings ]; then
              DISABLETON_MODE=prep DISABLETON_SETTINGS=1 dist/Disableton.app/Contents/MacOS/Disableton &
            else
              DISABLETON_MODE=$MODE dist/Disableton.app/Contents/MacOS/Disableton &
            fi
            PID=$!
            sleep 8
            if ! kill -0 $PID 2>/dev/null; then
              echo "L'app si è chiusa da sola (vista $MODE)"
              wait $PID || true
              exit 1
            fi
            screencapture -x "$RUNNER_TEMP/schermate/$MODE.png" || echo "schermata non disponibile"
            kill $PID
            wait $PID 2>/dev/null || true
            echo "Vista $MODE: avviata e in esecuzione"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: Schermate
          path: ${{ runner.temp }}/schermate
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: Disableton-macOS
          path: |
            dist/Disableton.zip
            dist/disableton-cli.zip
          retention-days: 30

      - name: 13. Pubblica la versione (release "latest")
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=0.1.${{ github.run_number }}
          git log -1 --format='%s%n%n%b' | grep -v -E '^(Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/note.md"
          gh release create "v$VERSION" dist/Disableton.zip dist/disableton-cli.zip \
            --title "Disableton $VERSION" --notes-file "$RUNNER_TEMP/note.md" --target "$GITHUB_SHA" --latest
